<!DOCTYPE html>
<html>

	<head>
		<meta http-equiv="Cache-Control" content="no-cache" />
		<meta charset="UTF-8" />
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
		<title></title>
		<link rel="stylesheet" href="../../docc/css/bootstrap.css">
		<link rel="stylesheet" href="../../docc/css/base.css">
		<link rel="stylesheet" href="../../docc/css/bom.css">
		<link rel="stylesheet" href="../../docc/css/select.css">
		<link rel="stylesheet" href="../../docc/css/jsonEdit.css">
	</head>

	<body class="margin-auto" ng-controller="cacheController">
		<div class="app-container">
			<div class="section-card">
				<form name="queryForm" class="form-horizontal" role="form">
					<div class="form-grid">
						<div style="grid-column: 1 / 1;">
							缓存类型：
							<custom-select required ng-model="dim.prefix" options="options.caches" label-key="baseName" style="width: 100%;"
										   value-key="baseCode" ng-change="changeType(dim.prefix)" searchable="true"
										   disabled="ctrl.isDisabled"
										   multiple="false" placeholder="请选择缓存类型">
							</custom-select>
						</div>
						<div style="grid-column: 2 / 2;">
							key：
							<custom-select required ng-model="dim.key" options="options.keys" label-key="baseName" style="width: 100%;"
										   value-key="baseCode" ng-change="options.cacheData=null" searchable="true"
										   disabled="ctrl.isDisabled"
										   multiple="false" placeholder="请选择key">
							</custom-select>
						</div>
						<div class="field-group"
							 style="grid-column: 3 / 4; display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; white-space: nowrap; flex-wrap: nowrap; flex-shrink: 0;flex-direction: row;">
							<button class="btn btn-primary btn-glossy" ng-click="queryCache()">查询</button>
							<button class="btn btn-primary btn-glossy" ng-click="refreshCache()">强制刷新缓存</button>
							<button class="btn btn-primary btn-glossy" ng-click="checkCache()">检查缓存并刷新</button>
						</div>
					</div>
				</form>
			</div>
			<div class="section-card">
				<div class="d-flex justify-content-around align-items-center" style="margin-bottom: 10px;">
					<angular-jsoneditor ng-model="options.cacheData" options="ctrl.editorOptions" style="width: 100%; height: 600px;display: block;overflow: auto;">
					</angular-jsoneditor>
				</div>
			</div>

			<!-- 公共组件 -->
			<div ng-include="'../../docc/common/modal.html'"></div>
			<div ng-include="'../../docc/common/tips.html'"></div>
			
		</div>
	</body>
	<script src="../../js/lib/bootstrap.bundle.js"></script>
	<script src="../../js/lib/underscore.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular.min.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular-sanitize.min.js"></script>
	<script src="../../js/lib/jsonEdit.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular-jsonedit.min.js"></script>
	<script src="../../js/sea.js"></script>
	<script>
		seajs.use('../../js/system/cacheManage');
	</script>

</html>
