<!DOCTYPE html>
<html>

	<head>
		<meta http-equiv="Cache-Control" content="no-cache" />
		<meta charset="UTF-8" />
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
		<title></title>
		<link rel="stylesheet" href="../../docc/css/bootstrap.css">
		<link rel="stylesheet" href="../../docc/css/bootstrap-icons.min.css">
		<link rel="stylesheet" href="../../docc/css/base.css">
		<link rel="stylesheet" href="../../docc/css/bom.css">
		<link rel="stylesheet" href="../../docc/css/app.css">
		<link rel="stylesheet" href="../../docc/css/select.css">
	</head>

	<body class="margin-auto" ng-controller="catalogueFlowsetController">
		<div class="app-container">
			<div class="section-card">
				<div class="form-grid">
					<div style="grid-column: 1 / 2;">
						<label>
							<i class="far fa-file-alt" style="color:#3b82f6;font-size:13px;"></i>
							应用
						</label>
						<custom-select required ng-model="dim.idRuleApplication" options="options.apps" label-key="applicationName"
									   value-key="idRuleApplication" ng-change="changeApp(dim.idRuleApplication)" searchable="true"
									   multiple="false" placeholder="请选择应用">
						</custom-select>
					</div>

					<div style="grid-column: 2 / 3;">
						<label>
							<i class="far fa-file-alt" style="color:#3b82f6;font-size:13px;"></i>
							规则分类
						</label>
						<custom-select required ng-model="dim.ruleRepCatalogueId" options="options.treeData" label-key="label"
									   value-key="ruleRepCatalogueId" ng-change="changeType(dim.ruleRepCatalogueId)" searchable="true"
									   multiple="false" placeholder="请选择规则分类">
						</custom-select>
					</div>
					<div class="field-group"
						 style="grid-column: 3 / 3; display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; white-space: nowrap; flex-wrap: nowrap; flex-shrink: 0;flex-direction: row;">
						<button class="btn btn-danger btn-glossy" ng-click="delCatalogue()">删除规则分类</button>
						<button class="btn btn-primary btn-glossy" ng-click="addCatalogue('show','appCatalogueModal')">新增规则分类</button>
						<button class="btn btn-danger btn-glossy" ng-click="delRules()">删除规则</button>
						<button class="btn btn-primary btn-glossy" ng-click="addRule()">新增规则</button>
					</div>
				</div>
			</div>

			<div class="section-card">
				<div class="table-responsive panel panel-default" style="border: none; box-shadow: none;">
					<table class="table table-bordered table-hover">
						<thead style="background-color: lavender;">
						<tr>
							<td style="width:100px;text-align: center;"><input type="checkbox" ng-model="dim.checkAll"
																			   ng-init="dim.checkAll=false" ng-click="checkAll(!dim.checkAll)" /></td>
							<td>规则ID</td>
							<td>规则名称</td>
							<td>规则描述</td>
							<td>规则结果</td>
							<td style="width: 200px;">&nbsp;</td>
						</tr>
						</thead>
						<tbody>
						<tr ng-repeat="rule in options.rules track by rule.ruleId">
							<td style="text-align: center;"><input type="checkbox" ng-model="rule.checked" /></td>
							<td>{{rule.ruleId}}</td>
							<td>{{rule.ruleName}}</td>
							<td>
								<div ng-repeat="demon in rule.rowTokens track by demon.id">
									<div ng-if="$index > 0" style="margin: 5px 0; display: flex; justify-content: center; align-items: center;">
										<span style="flex: 1; height: 1px; background: #e9edf2;"></span>
										<span style="width: 50px;text-align: center;">{{demon.rel}}</span>
										<span style="flex: 1; height: 1px; background: #e9edf2;"></span>
									</div>
									<div class="d-flex justify-content-around align-items-center" style="gap: 10px;">
										<span style="grid-column: 1 / 3;width: 100%;text-align: center;">{{demon.param1}}</span>
										<span style="grid-column: 2 / 3;width: 100%;text-align: center;">{{demon.metaRuleName}}</span>
										<span style="grid-column: 3 / 3;width: 100%;text-align: center;">{{demon.param2 || '规则参数'}}</span>
									</div>
								</div>
							</td>
							<td>{{rule.resultName}}</td>
							<td>
								<div class="d-flex justify-content-around align-items-center">
									<button class="btn btn-primary" ng-click="editRule(rule)">编辑</button>
									<button class="btn btn-danger" ng-click="delRule(rule)">删除</button>
								</div>
							</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>

			<div class="modal" id="appCatalogueModal" tabindex="-1" style="display: none;">
				<div class="modal-dialog">
					<div class="modal-content" style="width: 600px;">
						<div class="modal-header">
						</div>
						<div class="modal-body">
							<div style="padding:5px;" class="panel panel-default">
								<form name="catalogueForm" class="form-horizontal" role="form">
									<div class="field-group" style="margin-bottom: 10px;">
										<input type="text" ng-model="addDim.catalogue" required placeholder="请输入规则分类名字">
									</div>
									<button class="btn btn-primary" ng-click="saveCatalogue(catalogueForm)">
										确定
									</button>
								</form>
							</div>
						</div>
						<div class="modal-footer">
						</div>
					</div>
				</div>
			</div>
			<div ng-include="'../../docc/common/modal.html'"></div>
			<div ng-include="'../../docc/common/tips.html'"></div>
		</div>
	</body>
	<script src="../../js/lib/bootstrap.bundle.js"></script>
	<script src="../../js/lib/underscore.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular.min.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular-sanitize.min.js"></script>
	<script src="../../js/sea.js"></script>
	<script>
		seajs.use('../../js/ruleManage/catalogueFlowset');
	</script>

</html>
