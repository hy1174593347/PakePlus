<!DOCTYPE html>
<html>

	<head>
		<meta http-equiv="Cache-Control" content="no-cache" />
		<meta charset="UTF-8" />
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
		<title></title>
		<link rel="stylesheet" href="../../docc/css/bootstrap.css">
		<link rel="stylesheet" href="../../docc/css/base.css">
		<link rel="stylesheet" href="../../docc/css/bom.css">
		<link rel="stylesheet" href="../../docc/css/app.css">
		<link rel="stylesheet" href="../../docc/css/select.css">
	</head>

	<body class="margin-auto" ng-controller="appController">
		<div class="app-container fade-in">
			<form name="appForm" class="form-horizontal" role="form">
				<!-- ====== 页头 ====== -->
				<header class="page-header">
					<div class="page-header-left">
						<div class="icon-wrapper">
							<i class="fas fa-cube"></i>
						</div>
						<h1>创建应用</h1>
					</div>
				</header>

				<!-- ====== 卡片1：基本信息 ====== -->
				<section class="section-card">
					<div class="section-title">
						<span class="title-icon"><i class="fas fa-info-circle"></i></span>
						基本信息
						<span class="title-line"></span>
					</div>

					<div class="form-grid">
						<!-- 应用名称 -->
						<div class="field-group full-width">
							<label>
								<i class="far fa-file-alt" style="color:#3b82f6;font-size:13px;"></i>
								应用名称
							</label>
							<input ng-model="addDim.applicationName" required type="text" placeholder="请输入应用名称" value="" />
						</div>

						<!-- 应用ID -->
						<div class="field-group full-width">
							<label>
								<i class="far fa-file-alt" style="color:#3b82f6;font-size:13px;"></i>
								应用ID <span style="color: red;margin-left: 10px;">！应用ID后续不可修改，创建应用前请确认。</span>
							</label>
							<input ng-model="addDim.idRuleApplication" required type="text" placeholder="应用ID" value="" />
						</div>

						<!-- 应用描述（占两列） -->
						<div class="field-group full-width">
							<label>
								<i class="far fa-sticky-note" style="color:#3b82f6;font-size:13px;"></i>
								应用描述
							</label>
							<textarea placeholder="请输入应用描述" required rows="2" ng-model="addDim.applicationDesc"></textarea>
						</div>

						<!-- BOM -->
						<div class="field-group full-width">
							<label>
								<i class="far fa-file-alt" style="color:#3b82f6;font-size:13px;"></i>
								业务模型 <span style="color: red;margin-left: 10px;">！业务模型后续不可修改，创建应用前请确认。</span>
							</label>
							<custom-select required ng-model="addDim.propertyType" options="options.bomList"
								label-key="bomName" value-key="bomBaseInfoId" ng-change="changeBom(addDim.propertyType)"
								searchable="true" multiple="false" placeholder="请选择一项">
							</custom-select>
						</div>

						<!-- 规则库 -->
						<div class="field-group full-width">
							<div class="radio-row">
								<label class="label-text">
									<i class="far fa-file-alt" style="color:#3b82f6;font-size:13px;"></i>
									创建规则库
								</label>
								<label class="radio-inline" ng-click="clearRepository(ctrl.addRepository)">
									<input type="radio" name="repositoryBtn" ng-model="ctrl.addRepository" value="true" />是
								</label>
								<label class="radio-inline" ng-click="clearRepository(ctrl.addRepository)">
									<input type="radio" name="repositoryBtn" ng-model="ctrl.addRepository" value="false" />否
								</label>
							</div>

							<input ng-if="ctrl.addRepository=='true'" ng-model="addDim.decisionRepositoryName" required
								type="text" placeholder="规则库名称" value="" />
							<custom-select ng-show="ctrl.addRepository=='false'"
								ng-model="addDim.ruleRepositoryId" options="options.repositoryList"
								label-key="repositoryName" value-key="ruleRepositoryId"
								ng-change="changeRepository(addDim.ruleRepositoryId)" searchable="true" multiple="false"
								placeholder="请选择一项">
							</custom-select>
						</div>
					</div>
				</section>

				<!-- ====== 卡片2：维度信息 ====== -->
				<section class="section-card">
					<div class="section-title">
						<span class="title-icon"><i class="fas fa-brain"></i></span>
						维度信息
						<span class="title-line"></span>
					</div>

					<div class="decision-grid">
						<div class="field-group">
							<label>
								<i class="fas fa-database" style="color:#3b82f6;font-size:13px;"></i>
								决策维度
							</label>
							<custom-select ng-model="addDim.path" options="options.dimList" label-key="name"
								value-key="path" searchable="true" multiple="true"
								placeholder="请选择一项">
							</custom-select>
						</div>
					</div>

					<div class="decision-grid">
						<div class="field-group">
							<label>
								<i class="fas fa-database" style="color:#3b82f6;font-size:13px;"></i>
								应用类型 <span style="color: red;margin-left: 10px;">！应用类型后续不可修改，创建应用前请确认。</span>
							</label>
							<custom-select ng-model="addDim.appType" options="options.appTypeList" label-key="name"
										   value-key="path"
										   placeholder="请选择一项">
							</custom-select>
						</div>
					</div>
				</section>

				<!-- ====== 卡片3：应用结果信息 ====== -->
				<section class="section-card">
					<div class="section-title">
						<span class="title-icon"><i class="fas fa-brain"></i></span>
						应用结果
						<span class="title-line"></span>
					</div>

					<div class="decision-grid">
						<div class="field-group full-width">
							<div class="result-table-wrapper">
								<!-- 表格头部：标题 + 新增按钮 -->
								<div class="table-header-actions">
									<div class="table-title">
										<i class="fas fa-list" style="color:#3b82f6;"></i>
										应用输出结果
									</div>
									<button type="button" class="btn-add-row" ng-click="addResultRow()">
										<i class="fas fa-plus"></i>
										新增1行
									</button>
								</div>

								<!-- 表格 -->
								<div>
									<table class="result-table">
										<thead>
											<tr>
												<th>序号</th>
												<th>结果值</th>
												<th>操作</th>
											</tr>
										</thead>
										<tbody>
											<tr ng-repeat="row in addDim.resultDefines track by $index">
												<td>{{ $index + 1 }}</td>
												<td>
													<input type="text" class="result-input" ng-model="row.resultName"
														placeholder="请输入结果值..." ng-class="{'input-error': row.error}">
												</td>
												<td>
													<button ng-if="addDim.resultDefines.length > 1" type="button"
														class="btn-remove-row" ng-click="removeResultRow($index)">
														<i class="fas fa-times"></i>
														删除
													</button>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</section>

				<!-- ====== 底部操作按钮 ====== -->
				<div class="form-actions">
					<button type="button" class="btn btn-secondary" ng-click="cleanData()">
						重置
					</button>
					<button class="btn btn-primary" ng-click="saveAppData(appForm)">
						创建应用
					</button>
				</div>
			</form>
		</div>

		<div ng-include="'../../docc/common/modal.html'"></div>
		<div ng-include="'../../docc/common/tips.html'"></div>
	</body>
	<script src="../../js/lib/bootstrap.bundle.js"></script>
	<script src="../../js/lib/underscore.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular.min.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular-sanitize.min.js"></script>
	<script src="../../js/sea.js"></script>
	<script>
		seajs.use('../../js/app/createApp');
	</script>

</html>
