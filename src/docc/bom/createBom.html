<!DOCTYPE html>
<html>

	<head>
		<meta http-equiv="Cache-Control" content="no-cache" />
		<meta charset="UTF-8" />
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
		<title></title>
		<link rel="stylesheet" href="../../docc/css/bootstrap.css">
		<link rel="stylesheet" href="../../docc/css/base.css">
		<link rel="stylesheet" href="../../docc/css/bom.css">
		<link rel="stylesheet" href="../../docc/css/select.css">
	</head>

	<body class="margin-auto" ng-controller="bomController">
		<div class="app-container fade-in">
			<form name="bomForm" class="form-horizontal" role="form">
				<!-- ====== 页头 ====== -->
				<header class="page-header">
					<div class="page-header-left">
						<div class="icon-wrapper">
							<i class="fas fa-cube"></i>
						</div>
						<h1>业务模型配置</h1>
					</div>
				</header>

				<!-- ====== 卡片1：基本信息 ====== -->
				<section class="section-card">
					<div class="section-title">
						<span class="title-icon"><i class="fas fa-info-circle"></i></span>
						基本信息
						<span class="title-line"></span>
					</div>

					<div class="form-grid">
						<!-- 模型名称 -->
						<div class="full-width">
							<label>
								<i class="far fa-file-alt" style="color:#3b82f6;font-size:13px;"></i>
								业务模型名称
							</label>
							<custom-select required ng-model="dim.propertyType" options="options.bomList" label-key="name"
								value-key="propertyType" ng-change="changeType(dim.propertyType)" searchable="true"
								multiple="false" placeholder="请选择一项">
							</custom-select>
						</div>

						<!-- 备注信息（占两列） -->
						<div class="field-group full-width">
							<label>
								<i class="far fa-sticky-note" style="color:#3b82f6;font-size:13px;"></i>
								备注信息
							</label>
							<textarea placeholder="请输入备注信息" required rows="2" ng-model="addDim.remark"></textarea>
						</div>
					</div>
				</section>

				<!-- ====== 卡片3：规则库信息 ====== -->
				<section class="section-card">
					<div class="section-title">
						<span class="title-icon"><i class="fas fa-brain"></i></span>
						规则库信息
						<span class="title-line"></span>
					</div>

					<div class="decision-grid">
						<div class="field-group">
							<label>
								<i class="fas fa-database" style="color:#3b82f6;font-size:13px;"></i>
								规则库名称
							</label>
							<input ng-model="addDim.repositoryName" required type="text" placeholder="请输入规则库名称"
								value="" />
						</div>
					</div>
				</section>

				<!-- ====== 底部操作按钮 ====== -->
				<div class="form-actions">
					<button type="button" class="btn btn-secondary" ng-click="cleanData()">
						重置
					</button>
					<button class="btn btn-primary" ng-click="saveBomData(bomForm)">
						创建模型
					</button>
				</div>
			</form>
		</div>

		<div ng-include="'../../docc/common/modal.html'"></div>
		<div ng-include="'../../docc/common/tips.html'"></div>
	</body>
	<script src="../../js/lib/bootstrap.bundle.js"></script>
	<script src="../../js/lib/underscore.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular.min.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular-sanitize.min.js"></script>
	<script src="../../js/sea.js"></script>
	<script>
		seajs.use('../../js/bom/createBom');
	</script>

</html>
