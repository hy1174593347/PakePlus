<!DOCTYPE html>
<html>

	<head>
		<meta http-equiv="Cache-Control" content="no-cache" />
		<meta charset="UTF-8" />
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
		<title></title>
		<link rel="stylesheet" href="../../docc/css/bootstrap.css">
		<link rel="stylesheet" href="../../docc/css/base.css">
		<link rel="stylesheet" href="../../docc/css/bom.css">
		<link rel="stylesheet" href="../../docc/css/select.css">
	</head>

	<body class="margin-auto" ng-controller="baseController">
		<!-- YELLOW: 用 app-container 包裹全部内容 -->
		<div class="app-container">
		
			<!-- YELLOW: 顶部区域用 section-card 包裹 -->
			<div class="section-card">
				<!-- YELLOW: 使用 form-grid 实现两列布局 -->
				<div class="form-grid">
					<!-- 左侧下拉框 -->
					<div style="grid-column: 1 / 2;">
						<label>
							<i class="far fa-file-alt" style="color:#3b82f6;font-size:13px;"></i>
							基础数据类型
						</label>
						<custom-select ng-model="dim.baseType" options="options.baseTypes" label-key="remark"
							value-key="baseType" ng-change="changeType(dim.baseType)" searchable="true" multiple="false"
							placeholder="请选择一项">
						</custom-select>
					</div>
					<!-- 右侧按钮组 -->
					<div class="field-group"
						style="grid-column: 2 / 3; display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; white-space: nowrap; flex-wrap: nowrap; flex-shrink: 0;flex-direction: row;">
						<button class="btn btn-danger btn-glossy" ng-click="delete()">删除</button>
						<button class="btn btn-primary btn-glossy" ng-click="showAdd('show','baseAddModal')">新增</button>
					</div>
				</div>
			</div>
		
			<!-- YELLOW: 表格区域用 section-card 包裹 -->
			<div class="section-card">
				<div class="table-responsive panel panel-default" style="border: none; box-shadow: none;">
					<table class="table table-bordered table-hover">
						<thead style="background-color: lavender;">
							<tr>
								<td style="width:100px;text-align: center;"><input type="checkbox" ng-model="dim.checkAll"
										ng-init="dim.checkAll=false" ng-click="checkAll(!dim.checkAll)" /></td>
								<td>基础数据编码</td>
								<td>基础数据名称</td>
								<td>基础数据类型编码</td>
								<td>基础数据类型名称</td>
							</tr>
						</thead>
						<tbody>
							<tr ng-repeat="demon in options.baseDatas">
								<td style="text-align: center;"><input type="checkbox" ng-model="demon.checked" /></td>
								<td>{{demon.baseCode}}</td>
								<td>{{demon.baseName}}</td>
								<td>{{demon.baseType}}</td>
								<td>{{demon.remark}}</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		
			<!-- 模态框（沿用 bom.css 样式） -->
			<div class="modal" id="baseAddModal" tabindex="-1" style="display: none;">
				<div class="modal-dialog">
					<div class="modal-content" style="width: 600px;">
						<div class="modal-header">
						</div>
						<div class="modal-body">
							<form name="baseForm" class="form-horizontal" role="form">
								<div style="padding:5px;" class="panel panel-default">
									<!-- YELLOW: 使用 bom.css 中的 page-header-left -->
									<div class="page-header-left">
										<div class="icon-wrapper">
											<i class="fas fa-cube"></i>
										</div>
										<h1>新增基础数据</h1>
									</div>
									<div style="margin: 10px;">
										<label>基础数据编码</label>
										<input type="text" class="form-control" ng-model="addDim.baseCode" required
											placeholder="请输入编码">
									</div>
									<div style="margin: 10px;">
										<label>基础数据名称</label>
										<input type="text" class="form-control" ng-model="addDim.baseName" required
											placeholder="请输入名称">
									</div>
									<div style="margin: 10px;">
										<label>基础数据类型</label>
										<custom-select ng-model="addDim.baseType" options="options.addBaseTypes" label-key="remark"
											value-key="baseType" ng-change="checkAdd(addDim.baseType,addDim)" searchable="true" multiple="false"
											placeholder="请选择一项">
										</custom-select>
									</div>
								</div>
								<div class="form-actions" style="border-top: none; padding-top: 10px;">
									<button class="btn btn-primary btn-glossy" ng-click="saveBaseData(baseForm)">保存</button>
									<button type="button" class="btn btn-secondary btn-glossy" ng-click="cleanData(addDim)">清空</button>
								</div>
							</form>
						</div>
						<div class="modal-footer">
						</div>
					</div>
				</div>
			</div>
			<!-- 公共组件 -->
			<div ng-include="'../../docc/common/modal.html'"></div>
			<div ng-include="'../../docc/common/tips.html'"></div>
		</div>
	</body>
	<script src="../../js/lib/bootstrap.bundle.js"></script>
	<script src="../../js/lib/underscore.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular.min.js"></script>
	<script src="../../js/lib/angular1.8.3.min/angular-sanitize.min.js"></script>
	<script src="../../js/sea.js"></script>
	<script>
		seajs.use('../../js/base/baseData');
	</script>

</html>
